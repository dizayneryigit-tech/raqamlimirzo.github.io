  .logo.katta { width: 58px; height: 58px; }
  .brend b { font-size: 21px; letter-spacing: .3px; }
  .brend span { font-size: 13px; opacity: .88; }
  .ong { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .ong .ism { font-size: 14px; opacity: .95; }
  .til { display: inline-flex; border: 1.5px solid rgba(255,255,255,.75); border-radius: 999px; overflow: hidden; }
  .til button { background: transparent; border: 0; color: var(--oq); padding: 3px 11px; font-size: 13px; font-weight: 600; }
  .til button[aria-pressed="true"] { background: var(--oq); color: var(--kok1); }
  .shaffof { background: transparent; border: 1.5px solid rgba(255,255,255,.75); color: var(--oq); border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: 600; }

  /* Kirish oynasi */
  .kirish { min-height: 100vh; display: grid; place-items: center; padding: 24px; background:
    linear-gradient(160deg, var(--kok1) 0, var(--kok2) 38%, var(--fon) 38.1%); }
  .karta-kirish { width: 100%; max-width: 420px; background: var(--oq); border: 1.5px solid var(--kontur); border-radius: 16px; overflow: hidden; }
  .karta-kirish .polosa { background: linear-gradient(90deg, var(--bol1), var(--bol2)); color: var(--oq); padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .karta-kirish .polosa b { font-size: 24px; display: block; }
  .karta-kirish .polosa span { font-size: 13px; opacity: .92; }
  .karta-kirish form { padding: 22px 24px 26px; display: grid; gap: 14px; }
  label { font-size: 13px; font-weight: 600; color: var(--kul1); display: grid; gap: 6px; }
  input[type=text], textarea { width: 100%; border: 1.5px solid var(--kontur); border-radius: 10px; padding: 10px 12px; background: var(--oq); }
  input[type=text]:focus, textarea:focus { border-color: var(--kok); outline: none; box-shadow: 0 0 0 3px rgba(28,118,197,.15); }
  .kod { font-size: 24px; letter-spacing: 8px; text-align: center; font-weight: 700; }
  .tugma { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 700; background: var(--kok1); color: var(--oq); }
  .tugma:hover { background: #1458A8; }
  .tugma:disabled { background: var(--kul2); cursor: default; }
  .tugma.ikkinchi { background: var(--tkok); color: var(--kok1); }
  .tugma.ikkinchi:hover { background: #D6E6F7; }
  .izoh { font-size: 13px; color: var(--kul1); margin: 0; }
  .xato { font-size: 13px; color: var(--qizil); margin: 0; }

  /* Tablar */
  .tablar { background: var(--oq); border-bottom: 1.5px solid var(--kontur); }
  .tablar .ichki { display: flex; gap: 4px; }
  .tablar button { background: none; border: 0; padding: 14px 16px 12px; font-weight: 700; color: var(--kul1); border-bottom: 3px solid transparent; }
  .tablar button[aria-selected="true"] { color: var(--kok1); border-bottom-color: var(--kok1); }
  main { padding: 24px 0 48px; }

  /* Kartochkalar */
  .karta { background: var(--oq); border: 1.5px solid var(--kontur); border-radius: 16px; overflow: hidden; }
  .karta > .bar { background: linear-gradient(90deg, var(--bol1), var(--bol2)); color: var(--oq); font-weight: 700; font-size: 14px; padding: 11px 20px; display: flex; justify-content: space-between; gap: 12px; }
  .karta > .tana { padding: 20px; }
  .bosqich-sar { font-size: 13px; font-weight: 700; color: var(--kul1); margin: 0 0 10px; }

  .guruh-sarlavha { grid-column: 1 / -1; font-weight: 700; margin: 8px 0 0; }
  .xizmatlar { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .xizmat { text-align: left; background: var(--oq); border: 1.5px solid var(--kontur); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
  .xizmat b { font-size: 15px; }
  .xizmat small { color: var(--kul2); font-size: 12px; }
  .xizmat[aria-pressed="true"] { border-color: var(--kok); background: var(--tkok); }
  .xizmat.yopiq { color: var(--kul2); }
  .belgi { display: inline-block; width: max-content; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--ajrat); color: var(--kul1); }

  .tashlash { border: 1.5px dashed var(--kul2); border-radius: 12px; background: var(--fon); padding: 18px; text-align: center; color: var(--kul1); }
  .tashlash.ustida { border-color: var(--kok); background: var(--tkok); }
  .tashlash b { color: var(--siyoh); }
  .forma { display: grid; gap: 16px; }
  .segment { display: inline-flex; border: 1.5px solid var(--kontur); border-radius: 10px; overflow: hidden; width: max-content; max-width: 100%; flex-wrap: wrap; }
  .segment button { background: var(--oq); border: 0; padding: 9px 14px; font-weight: 600; color: var(--kul1); }
  .segment button[aria-pressed="true"] { background: var(--kok1); color: var(--oq); }

  /* Topshiriqlar — papkalar */
  .royxat-bosh { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
  .royxat-bosh b { font-size: 18px; }
  .royxat { display: grid; gap: 12px; }
  .papka { background: var(--oq); border: 1.5px solid var(--kontur); border-left: 5px solid var(--kul2); border-radius: 14px; overflow: hidden; }
  .papka.tayyor { border-left-color: var(--yashil); }
  .papka.jarayonda { border-left-color: var(--kok); }
  .papka.kutilmoqda { border-left-color: var(--sariq); }
  .papka-bosh { display: flex; align-items: center; padding-left: 14px; }
  .papka-bosh > input, .fayl > input { width: 18px; height: 18px; accent-color: var(--kok1); flex: none; margin: 0; }
  .papka-ochgich { flex: 1; min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; background: none; border: 0; text-align: left; padding: 14px 16px 14px 12px; }
  .papka-belgi svg { width: 30px; height: 30px; display: block; }
  .papka.tayyor .papka-belgi { color: var(--yashil); }
  .papka.jarayonda .papka-belgi { color: var(--kok); }
  .papka.kutilmoqda .papka-belgi { color: var(--sariq); }
  .papka.tekshiruvda .papka-belgi { color: var(--kul2); }
  .papka-nom { display: grid; min-width: 0; }
  .papka-nom b { font-size: 15.5px; }
  .papka-nom small { font-size: 13px; color: var(--kul1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
  .chip.tayyor { background: var(--tyashil); color: var(--yashil); }
  .chip.jarayonda { background: var(--tkok); color: var(--kok1); }
  .chip.kutilmoqda { background: var(--tsariq); color: #B45309; }
  .chip.tekshiruvda { background: var(--ajrat); color: var(--kul1); }
  .chip .nuqta { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: puls 1.4s ease-in-out infinite; }
  @keyframes puls { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  .strelka svg { width: 20px; height: 20px; display: block; color: var(--kul2); transition: transform .2s ease; }
  .papka.ochiq .strelka svg { transform: rotate(180deg); }

<script>
  var MATNLAR = <?!= matnlarJson ?>;
  var BOSH_TOKEN = <?!= JSON.stringify(boshToken) ?>;

  var holat = { til: 'uz', token: '', xizmatlar: [], tanlangan: '', tanqid: 'ha', fayl: null, yangilash: null, kodTaymer: null, tanlov: { v: {}, f: {} }, ochiq: {}, oxirgi: [], tasdiqda: false };

  function t(k, alm) {
    var m = (MATNLAR[holat.til] && MATNLAR[holat.til][k]) || (MATNLAR.uz && MATNLAR.uz[k]) || k;
    if (alm) Object.keys(alm).forEach(function (a) { m = String(m).split('{' + a + '}').join(alm[a]); });
    return m;
  }
  function el(teg, sinf, matn) { var e = document.createElement(teg); if (sinf) e.className = sinf; if (matn != null) e.textContent = matn; return e; }
  function $(id) { return document.getElementById(id); }

  function chaqir(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, rad) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { rad(e); });
      r[fn].apply(r, args);

  }
  function xabar(m, xatomi) {

    clearTimeout(b._t); b._t = setTimeout(function () { b.hidden = true; }, 4200);
  }
  function xatoQayta(e) {
    var m = String(e && e.message ? e.message : e);
    if (m.indexOf('SESSIYA') >= 0) { chiqishQil(true); return; }
    xabar(t('w_xato', { x: m }), true);
  }

  function matnlarniQoy() {
    document.documentElement.lang = holat.til;
    document.querySelectorAll('[data-t]').forEach(function (e) { e.textContent = t(e.getAttribute('data-t')); });
    document.querySelectorAll('[data-til]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-til') === holat.til ? 'true' : 'false'); });
    if (holat.fayl) $('faylMatn').textContent = holat.fayl.name + ' · ' + (holat.fayl.size / 1048576).toFixed(1) + ' MB';
  }

  function saqla(tok) { holat.token = tok || ''; try { if (tok) sessionStorage.setItem('mirzo_t', tok); else sessionStorage.removeItem('mirzo_t'); } catch (e) {} }
  function ol() { try { return sessionStorage.getItem('mirzo_t') || ''; } catch (e) { return ''; } }

  /* ---------- Kirish ---------- */
  function kirishKorsat() {
    $('ilova').hidden = true; $('kirishOyna').hidden = false;
    $('kodBolim').hidden = true; $('kirishXato').textContent = ''; matnlarniQoy();
    setTimeout(function () { $('login').focus(); }, 50);
  }
  $('kodOlish').addEventListener('click', function () {
    var login = $('login').value.trim();
    $('kirishXato').textContent = '';
    if (!login) { $('kirishXato').textContent = t('w_xato_login'); return; }
    var b = $('kodOlish'); b.disabled = true;
    chaqir('apiKodSorash', login, holat.til).then(function (r) {
      b.disabled = false;
      if (!r.ok) { $('kirishXato').textContent = r.xato; return; }
      $('kodBolim').hidden = false; $('kod').value = ''; $('kod').focus();
      var qolgan = r.sek;
      clearInterval(holat.kodTaymer);
      $('kodIzoh').textContent = t('w_kod_yuborildi', { sek: qolgan });
      holat.kodTaymer = setInterval(function () {
        qolgan--;
        if (qolgan <= 0) { clearInterval(holat.kodTaymer); $('kodIzoh').textContent = t('w_kod_muddati'); return; }
        $('kodIzoh').textContent = t('w_kod_yuborildi', { sek: qolgan });
      }, 1000);
    }).catch(function (e) { b.disabled = false; $('kirishXato').textContent = String(e.message || e); });
  });
  $('kirishForma').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var kod = $('kod').value.replace(/\D/g, '');
    if (kod.length !== 6) { $('kirishXato').textContent = t('w_xato_kod'); return; }
    var b = $('kirishTugma'); b.disabled = true;
    chaqir('apiKirish', $('login').value.trim(), kod, holat.til).then(function (r) {
      b.disabled = false;
      if (!r.ok) { $('kirishXato').textContent = r.xato; return; }
      clearInterval(holat.kodTaymer); saqla(r.token); boshla();
    }).catch(function (e) { b.disabled = false; $('kirishXato').textContent = String(e.message || e); });
  });

  /* ---------- Ilova ---------- */
  function boshla() {
    chaqir('apiBoshlash', holat.token).then(function (r) {
      holat.til = r.user.til === 'ru' ? 'ru' : 'uz';
      holat.xizmatlar = r.xizmatlar || [];
      holat.guruhNomlari = r.guruhNomlari || {};
      $('ism').textContent = r.user.fio || r.user.login;
      $('kirishOyna').hidden = true; $('ilova').hidden = false;
      matnlarniQoy(); xizmatlarniChiz(); tab('yangi');
    }).catch(xatoQayta);
  }
  function chiqishQil(jim) {
    if (holat.token && !jim) chaqir('apiChiqish', holat.token).catch(function () {});
    saqla(''); clearInterval(holat.yangilash); kirishKorsat();
  }
  $('chiqish').addEventListener('click', function () { chiqishQil(false); });

  document.querySelectorAll('[data-til]').forEach(function (b) {
    b.addEventListener('click', function () {
      holat.til = b.getAttribute('data-til'); matnlarniQoy();
      if (holat.token && !$('ilova').hidden) { chaqir('apiTil', holat.token, holat.til).catch(function () {}); xizmatlarniChiz(); if (!$('royxatBolim').hidden) royxatniYukla(); }
    });
  });

  /* Ro'yxat yangilanayotganda foydalanuvchi yozayotgan matn o'chib ketmasin */
  function yozilmoqda() {
    var f = document.activeElement;
    if (f && f.tagName === 'TEXTAREA') return true;
    if (tanlovSoni() > 0) return true;
    return Array.prototype.some.call(document.querySelectorAll('#royxat textarea'), function (t) { return t.value.trim() !== ''; });
  }

  function tab(nom) {
    $('tabYangi').setAttribute('aria-selected', nom === 'yangi' ? 'true' : 'false');
    $('tabRoyxat').setAttribute('aria-selected', nom === 'royxat' ? 'true' : 'false');
    $('yangiBolim').hidden = nom !== 'yangi'; $('royxatBolim').hidden = nom !== 'royxat';
    clearInterval(holat.yangilash);
    if (nom === 'royxat') { royxatniYukla(); holat.yangilash = setInterval(function () { if (!document.hidden && !yozilmoqda()) royxatniYukla(); }, 20000); }
  }
  $('tabYangi').addEventListener('click', function () { tab('yangi'); });
  $('tabRoyxat').addEventListener('click', function () { tab('royxat'); });

  function xizmatlarniChiz() {
    var w = $('xizmatlar'); w.innerHTML = ''; var oldingiG = '';
    holat.xizmatlar.forEach(function (x) {
      if (x.guruh && x.guruh !== oldingiG && Object.keys(holat.guruhNomlari || {}).length > 1) { w.appendChild(el('div', 'guruh-sarlavha', holat.guruhNomlari[x.guruh] || '')); oldingiG = x.guruh; }
      var b = el('button', 'xizmat' + (x.yoq ? '' : ' yopiq'));
      b.type = 'button';
      b.appendChild(el('b', '', holat.til === 'ru' ? x.ru : x.uz));
      if (!x.yoq) b.appendChild(el('span', 'belgi', t('w_ochiq_emas')));
      b.setAttribute('aria-pressed', holat.tanlangan === x.kod ? 'true' : 'false');
      b.addEventListener('click', function () {
        if (!x.yoq) { xabar(x.ochiqEmas || t('w_ochiq_emas'), true); return; }
        holat.tanlangan = x.kod; xizmatlarniChiz();
      });
      w.appendChild(b);
    });
    if (!holat.tanlangan) { var bir = holat.xizmatlar.filter(function (x) { return x.yoq; })[0]; if (bir) { holat.tanlangan = bir.kod; xizmatlarniChiz(); return; } }
    $('tanqidBolim').hidden = holat.tanlangan !== 'S2';
    var tq = (holat.xizmatlar.filter(function (x) { return x.kod === holat.tanlangan; })[0] || {}).quvur;
    $('hajmBolim').hidden = !(tq === 'slayd' || tq === 'maket');
  }

  document.querySelectorAll('[data-tanqid]').forEach(function (b) {
    b.addEventListener('click', function () {
      holat.tanqid = b.getAttribute('data-tanqid');
      document.querySelectorAll('[data-tanqid]').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    });
  });

  var tsh = $('tashlash');
  ['dragenter', 'dragover'].forEach(function (h) { tsh.addEventListener(h, function (e) { e.preventDefault(); tsh.classList.add('ustida'); }); });
  ['dragleave', 'drop'].forEach(function (h) { tsh.addEventListener(h, function (e) { e.preventDefault(); tsh.classList.remove('ustida'); }); });
  tsh.addEventListener('drop', function (e) { if (e.dataTransfer.files[0]) faylTanla(e.dataTransfer.files[0]); });
  $('fayl').addEventListener('change', function () { if (this.files[0]) faylTanla(this.files[0]); });
  function faylTanla(f) {
    if (f.size > 20 * 1048576) { xabar('20 MB', true); return; }
    holat.fayl = f; matnlarniQoy();
  }

  $('topshiriqForma').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var matn = $('matn').value.trim();
    if (!holat.tanlangan) { xabar(t('w_xizmat'), true); return; }
    if (!holat.fayl && !matn) { xabar(t('w_fayl_tanlang'), true); return; }
    var b = $('yuborish'); b.disabled = true;
    var yubor = function (fayl) {
      chaqir('apiTopshiriqYarat', holat.token, { xizmat: holat.tanlangan, matn: matn, tanqid: holat.tanqid, betlar: Number($('betlar').value) || 0, fayl: fayl }).then(function (r) {
        b.disabled = false;
        if (!r.ok) { xabar(r.xato, true); return; }
        xabar(t('w_yuborildi', { id: r.id }));
        holat.fayl = null; $('fayl').value = ''; $('matn').value = ''; $('faylMatn').textContent = t('w_fayl_tanlang');
        tab('royxat');
      }).catch(function (e) { b.disabled = false; xatoQayta(e); });
    };
    if (!holat.fayl) { yubor(null); return; }
    var o = new FileReader();
    o.onload = function () { yubor({ nom: holat.fayl.name, mime: holat.fayl.type, b64: String(o.result).split(',')[1] }); };
    o.onerror = function () { b.disabled = false; xabar(t('w_xato', { x: 'fayl' }), true); };
    o.readAsDataURL(holat.fayl);
  });

  /* ---------- Topshiriqlar ro'yxati ---------- */
  function royxatniYukla() {
    chaqir('apiTopshiriqlar', holat.token).then(function (r) { royxatniChiz(r.topshiriqlar || []); }).catch(xatoQayta);
  }

  var SVG_PAPKA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2.2h7A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="currentColor" opacity=".14"/><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2.2h7A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  var SVG_STRELKA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function svg(sinf, kod) { var s = el('span', sinf); s.innerHTML = kod; return s; }
  function tanlovSoni() { var n = Object.keys(holat.tanlov.v).length; Object.keys(holat.tanlov.f).forEach(function (k) { n += holat.tanlov.f[k].length; }); return n; }
  function chipMatni(tk) { return tk.holat === 'tayyor' ? t('w_tayyor_fayl', { n: tk.fayllar.length }) : t('w_' + tk.holat); }

  /* Tanlov paneli: o'chirish faqat saytdagi ro'yxatdan (Drive va Telegram'ga tegilmaydi) */
  function panelniYangila() {
    var n = tanlovSoni(), p = $('tanlovPaneli'), m = $('tanlovMatn'), a = $('tanlovAmallar');
    p.hidden = n === 0; if (!n) { holat.tasdiqda = false; return; }
    m.innerHTML = ''; a.innerHTML = '';
    m.appendChild(document.createTextNode(t('w_tanlandi', { n: n })));
    if (holat.tasdiqda) m.appendChild(el('small', '', t('w_ochirish_tasdiq')));
    var asosiy = el('button', 'tugma xavf kichik', t(holat.tasdiqda ? 'w_ha_ochir' : 'w_ochirish')); asosiy.type = 'button';
    asosiy.addEventListener('click', function () {
      if (!holat.tasdiqda) { holat.tasdiqda = true; panelniYangila(); return; }
      asosiy.disabled = true;
      chaqir('apiYashir', holat.token, Object.keys(holat.tanlov.v), holat.tanlov.f).then(function (r) {
        if (!r.ok) { asosiy.disabled = false; xabar(t('w_xato', { x: r.xato }), true); return; }
        holat.tanlov = { v: {}, f: {} }; holat.tasdiqda = false;
        xabar(t('w_ochirildi', { n: r.n })); royxatniYukla();
      }).catch(function (e) { asosiy.disabled = false; xatoQayta(e); });
    });
    var bekor = el('button', 'tugma ikkinchi kichik', t('w_bekor')); bekor.type = 'button';
    bekor.addEventListener('click', function () { holat.tanlov = { v: {}, f: {} }; holat.tasdiqda = false; royxatniChiz(holat.oxirgi); });
    a.appendChild(asosiy); a.appendChild(bekor);
  }

  function royxatniChiz(arr) {
    holat.oxirgi = arr;
    var w = $('royxat'); w.innerHTML = '';
    var bor = {}; arr.forEach(function (tk) { bor[tk.id] = 1; });
    Object.keys(holat.tanlov.v).forEach(function (id) { if (!bor[id]) delete holat.tanlov.v[id]; });
    Object.keys(holat.tanlov.f).forEach(function (id) { if (!bor[id]) delete holat.tanlov.f[id]; });
    if (!arr.length) w.appendChild(el('div', 'karta bosh-holat', t('w_bosh')));
    arr.forEach(function (tk) { w.appendChild(papkaYasa(tk)); });
    panelniYangila();
  }

  function papkaYasa(tk) {
    var ochiq = tk.holat === 'kutilmoqda' || !!holat.ochiq[tk.id];
    var p = el('article', 'papka ' + tk.holat + (ochiq ? ' ochiq' : ''));
    var bosh = el('div', 'papka-bosh');
    var cb = el('input'); cb.type = 'checkbox'; cb.checked = !!holat.tanlov.v[tk.id]; cb.setAttribute('aria-label', t('w_tanlash') + ': ' + tk.id);
    cb.addEventListener('change', function () { if (cb.checked) holat.tanlov.v[tk.id] = true; else delete holat.tanlov.v[tk.id]; holat.tasdiqda = false; panelniYangila(); });
    var och = el('button', 'papka-ochgich'); och.type = 'button'; och.setAttribute('aria-expanded', ochiq ? 'true' : 'false');
    och.appendChild(svg('papka-belgi', SVG_PAPKA));
    var nom = el('span', 'papka-nom');
    nom.appendChild(el('b', '', tk.xizmat));
    var meta = [tk.id + (tk.versiya > 1 ? ' · ' + t('w_versiya', { v: tk.versiya }) : ''), tk.sana];
    if (tk.mavzu) meta.push(tk.mavzu);
    nom.appendChild(el('small', '', meta.join(' · ')));
    och.appendChild(nom);
    var chip = el('span', 'chip ' + tk.holat);
    if (tk.holat === 'jarayonda') chip.appendChild(el('i', 'nuqta'));
    chip.appendChild(document.createTextNode(chipMatni(tk)));
    och.appendChild(chip);
    och.appendChild(svg('strelka', SVG_STRELKA));
    och.addEventListener('click', function () { holat.ochiq[tk.id] = !ochiq; royxatniChiz(holat.oxirgi); });
    bosh.appendChild(cb); bosh.appendChild(och); p.appendChild(bosh);
    if (tk.holat === 'jarayonda') { var jc = el('div', 'jarayon'); jc.appendChild(el('i')); p.appendChild(jc); }
    if (ochiq) p.appendChild(papkaTanasi(tk));
    return p;
  }

  function papkaTanasi(tk) {
    var tana = el('div', 'papka-tana');
    if (tk.holat === 'jarayonda') tana.appendChild(el('p', 'izoh', t(tk.fon ? 'w_fon' : 'w_jarayonda_izoh')));
    if (tk.holat === 'tekshiruvda') tana.appendChild(el('p', 'izoh', t('w_tekshiruvda_izoh')));
    if (tk.tahrirIzoh) { var oz = el('div', 'ozgarish'); oz.appendChild(el('b', '', t('w_ozgarishlar'))); oz.appendChild(el('div', '', tk.tahrirIzoh)); tana.appendChild(oz); }

    if (tk.savollar && tk.savollar.length) {
      var sv = el('div', 'savollar'); sv.appendChild(el('b', '', t('savollar')));
      var ol = el('ol'); tk.savollar.forEach(function (s) { ol.appendChild(el('li', '', s)); }); sv.appendChild(ol);
      var ta = el('textarea'); ta.rows = 3; ta.setAttribute('aria-label', t('w_javob')); sv.appendChild(ta);
      var jb = el('button', 'tugma kichik', t('w_javob_yubor')); jb.type = 'button';
      jb.addEventListener('click', function () {
        jb.disabled = true;
        chaqir('apiJavob', holat.token, tk.id, ta.value.trim() || '—').then(function () { royxatniYukla(); }).catch(function (e) { jb.disabled = false; xatoQayta(e); });
      });
      sv.appendChild(jb); tana.appendChild(sv);
    }

    if (tk.holat === 'kutilmoqda' && tk.bosqich === 'tasdiq') {
      var tz = el('div', 'savollar'); tz.appendChild(el('b', '', t(tk.kod === 'S5' ? 'w_tasdiq_sar' : 'w_ikki_sar')));
      var okB = el('button', 'tugma kichik', t('w_tasdiq_ha')); okB.type = 'button';
      okB.addEventListener('click', function () { okB.disabled = true; chaqir('apiTasdiq', holat.token, tk.id, 'ha', '').then(function () { royxatniYukla(); }).catch(function (e) { okB.disabled = false; xatoQayta(e); }); });
      var ta2 = el('textarea'); ta2.rows = 3; ta2.setAttribute('aria-label', t('w_tuzatish'));
      var tb2 = el('button', 'tugma ikkinchi kichik', t('w_tuzatish_yubor')); tb2.type = 'button';
      tb2.addEventListener('click', function () { if (!ta2.value.trim()) { ta2.focus(); return; } tb2.disabled = true; chaqir('apiTasdiq', holat.token, tk.id, 'tuz', ta2.value.trim()).then(function () { royxatniYukla(); }).catch(function (e) { tb2.disabled = false; xatoQayta(e); }); });
      tz.appendChild(okB); tz.appendChild(el('span', 'izoh', t('w_tuzatish'))); tz.appendChild(ta2); tz.appendChild(tb2);
      tana.appendChild(tz);
    }

    if (tk.fayllar && tk.fayllar.length) {
      var fl = el('div', 'fayllar');
      tk.fayllar.forEach(function (f) {
        var q = el('div', 'fayl');
        var fcb = el('input'); fcb.type = 'checkbox'; fcb.setAttribute('aria-label', t('w_tanlash') + ': ' + f.qism);
        fcb.checked = (holat.tanlov.f[tk.id] || []).indexOf(f.id) >= 0;
        fcb.addEventListener('change', function () {
          var a = holat.tanlov.f[tk.id] || [], i = a.indexOf(f.id);
          if (fcb.checked && i < 0) a.push(f.id);
          if (!fcb.checked && i >= 0) a.splice(i, 1);
          if (a.length) holat.tanlov.f[tk.id] = a; else delete holat.tanlov.f[tk.id];
          holat.tasdiqda = false; panelniYangila();
        });
        var nomi = el('span', 'fayl-nom', f.qism); nomi.title = f.nom;
        var am = el('div', 'amallar');
        var y = el('button', 'tugma kichik', t('w_yuklab')); y.type = 'button';
        y.addEventListener('click', function () { yukla(f, y); });
        var tg = el('button', 'tugma ikkinchi kichik', t('w_telegramga')); tg.type = 'button';
        tg.addEventListener('click', function () {
          tg.disabled = true;
          chaqir('apiTelegramgaYubor', holat.token, f.id).then(function (r) { tg.disabled = false; xabar(r.ok ? t('w_yuborildi_tg') : t('w_xato', { x: r.xato }), !r.ok); }).catch(function (e) { tg.disabled = false; xatoQayta(e); });
        });
        am.appendChild(y); am.appendChild(tg);
        q.appendChild(fcb); q.appendChild(el('span', 'tur ' + f.tur, f.tur.toUpperCase())); q.appendChild(nomi); q.appendChild(am);
        fl.appendChild(q);
      });
      tana.appendChild(fl);
      if (tk.fayllar.length > 1) {
        var zb = el('button', 'tugma ikkinchi kichik zip', t('w_zip')); zb.type = 'button';
        zb.addEventListener('click', function () {
          zb.disabled = true;
          chaqir('apiZip', holat.token, tk.id).then(function (r) { zb.disabled = false; if (!r.ok) { xabar(r.xato, true); return; } faylniBer(r); }).catch(function (e) { zb.disabled = false; xatoQayta(e); });
        });
        tana.appendChild(zb);
      }
    }

    if (tk.etirozMumkin) {
      var et = el('div', 'etiroz');
      et.appendChild(el('b', '', t('w_etiroz')));
      et.appendChild(el('p', 'izoh', t('w_etiroz_izoh')));
      var ta3 = el('textarea'); ta3.rows = 3; ta3.setAttribute('aria-label', t('w_etiroz'));
      var eb = el('button', 'tugma ikkinchi kichik', t('w_etiroz_yubor')); eb.type = 'button';
      eb.addEventListener('click', function () {
        if (!ta3.value.trim()) { ta3.focus(); return; }
        eb.disabled = true;
        chaqir('apiEtiroz', holat.token, tk.id, ta3.value.trim()).then(function (r) {
          if (!r.ok) { eb.disabled = false; xabar(r.xato, true); return; }
          ta3.value = ''; xabar(t('w_etiroz_yuborildi', { v: r.v })); royxatniYukla();
        }).catch(function (e) { eb.disabled = false; xatoQayta(e); });
      });
      et.appendChild(ta3); et.appendChild(eb);
      tana.appendChild(et);
    }
    return tana;
  }

  function faylniBer(r) {
    var bin = atob(r.b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: r.mime }));
    var a = document.createElement('a'); a.href = url; a.download = r.nom; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 3000);
  }

  function yukla(f, tugma) {
    tugma.disabled = true;
    chaqir('apiFaylOl', holat.token, f.id).then(function (r) {
      tugma.disabled = false;
      if (!r.ok) { xabar(t('w_xato', { x: r.xato }), true); return; }
      faylniBer(r);
    }).catch(function (e) { tugma.disabled = false; xatoQayta(e); });
  }

  $('yangilaTugma').addEventListener('click', royxatniYukla);

  /* ---------- Boshlanish ---------- */
  (function () {
    var tok = BOSH_TOKEN || ol();
    if (tok) { saqla(tok); boshla(); } else kirishKorsat();
  })();
</script>
</body>
</html>
