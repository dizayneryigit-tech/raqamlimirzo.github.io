<body>
<div class="yuk" id="yuk" role="status" aria-live="polite">
  <div class="karta">
    <div class="logo" role="img" aria-label="Raqamli Mirzo"></div>
    <h1>Raqamli Mirzo</h1>
    <p class="sar">Tahliliy taşkilotlar platformasi</p>
    <div class="chiziq"><i></i></div>
    <p class="sekin">Ulanish odatdagidan uzoq davom etyapti. <a id="togri" href="#" target="_top">To'g'ridan-to'g'ri ochish</a></p>
  </div>
  <div class="versiya">Versiya 0.1</div>
</div>
<iframe id="ilova" title="Raqamli Mirzo" allow="clipboard-write; fullscreen"></iframe>
<script>
(function () {
  /* YAGONA SOZLAMA: Apps Script veb-ilova manzili (Deploy → Manage deployments → Web app URL).
     Yangilanishda «New version» qilinsa manzil o'zgarmaydi — bu qatorga tegmang. */
  var MANZIL = 'https://script.google.com/macros/s/AKfycbzoQJuzkBgFSZbCufuuPhRPLJO9oslq_cE_8Iwqa28w_pwLnFGdwtE3fW9Z0Ercw23i/exec';

  var tg = window.Telegram && window.Telegram.WebApp, q = new URLSearchParams(location.search), p = new URLSearchParams();
  if (tg && tg.initData) {
    p.set('tgd', tg.initData);
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.setHeaderColor('#FFFFFF'); tg.setBackgroundColor('#F1F4F8'); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  }
  if (q.get('k')) p.set('k', q.get('k'));
  if (/^T-\d{3,}$/.test(q.get('t') || '')) p.set('t', q.get('t'));
  if (/^[\w-]{10,}$/.test(q.get('f') || '')) p.set('f', q.get('f'));
  var src = MANZIL + (p.toString() ? '?' + p.toString() : '');
  var fr = document.getElementById('ilova'), yuk = document.getElementById('yuk');
  document.getElementById('togri').href = src;
  function yashir() { yuk.classList.add('yoq'); }
  /* Ilova birinchi ekranini ko'rsatgach «tayyor» xabarini yuboradi — shunda yuklanish ekrani yopiladi */
  window.addEventListener('message', function (e) {
    var ok = false; try { ok = /(^|\.)googleusercontent\.com$|(^|\.)google\.com$/.test(new URL(e.origin).hostname); } catch (x) {}
    if (!ok || !e.data) return;
    if (e.data.raqamliMirzo === 'tayyor') yashir();
    if (e.data.raqamliMirzo === 'och' && /^https:\/\//.test(String(e.data.url || ''))) {
      try { if (tg && tg.initData && tg.openLink) tg.openLink(String(e.data.url)); else window.open(String(e.data.url), '_blank', 'noopener'); } catch (x) { location.href = String(e.data.url); }
    }
  });
  fr.addEventListener('load', function () { setTimeout(yashir, 8000); });
  setTimeout(function () { if (!yuk.classList.contains('yoq')) yuk.classList.add('kech'); }, 15000);
  fr.src = src;
})();
</script>
